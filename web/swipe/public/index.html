<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Saintiment Swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#fafaf9; --surface:#ffffff; --sunk:#f5f5f4; --fg:#1c1917; --muted:#78716c; --faint:#a8a29e; --line:#e7e5e4;
  --accent:#2563eb; --keep:#16a34a; --reject:#dc2626;
  /* 3 keyword layers: architecture / AI / skill */
  --l1-bg:#dbeafe; --l1-fg:#1e40af; --l2-bg:#ede9fe; --l2-fg:#5b21b6; --l3-bg:#dcfce7; --l3-fg:#166534;
  --font:"Vazirmatn",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --post-size:17px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09; --surface:#1c1917; --sunk:#151311; --fg:#f5f5f4; --muted:#a8a29e; --faint:#78716c; --line:#292524;
    --accent:#60a5fa; --keep:#4ade80; --reject:#f87171;
    --l1-bg:#1e3a8a66; --l1-fg:#bfdbfe; --l2-bg:#4c1d9566; --l2-fg:#ddd6fe; --l3-bg:#14532d66; --l3-fg:#bbf7d0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09; --surface:#1c1917; --sunk:#151311; --fg:#f5f5f4; --muted:#a8a29e; --faint:#78716c; --line:#292524;
  --accent:#60a5fa; --keep:#4ade80; --reject:#f87171;
  --l1-bg:#1e3a8a66; --l1-fg:#bfdbfe; --l2-bg:#4c1d9566; --l2-fg:#ddd6fe; --l3-bg:#14532d66; --l3-fg:#bbf7d0;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 15px/1.7 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}
.screen{display:none;max-width:720px;margin:0 auto;padding:0 16px}
.screen.active{display:block}

/* Login */
#loginScreen.active{display:grid;place-items:center;min-height:100dvh}
.login{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.login h1{margin:0;font-size:20px;font-weight:700}
.login input{font-size:16px;font-weight:500;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;direction:ltr}
.login input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.primary{background:var(--fg);color:var(--bg);border-radius:12px;padding:13px;font-weight:700}
.primary:disabled{opacity:.5}
.err{color:var(--reject);font-size:13px;min-height:1.4em}

/* Header */
.head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.head h1{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.icon-btn:hover,.icon-btn.on{background:var(--line);color:var(--fg)}
.text-btn{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px}
.text-btn:hover{color:var(--fg);background:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--keep);flex:none;transition:background .2s}
.dot.wait{background:#d97706} .dot.bad{background:var(--reject)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--keep)} .bar .r{background:var(--reject)}

/* Sets */
.sets{display:grid;gap:10px;padding:8px 0 24px}
.set{display:grid;gap:10px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.set:hover{border-color:var(--faint)}
.set-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.set-name{font-size:17px;font-weight:700}
.set-num{color:var(--faint);font-weight:500;margin-inline-end:6px}
.set-meta{font-size:13px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;padding:4px 0 32px}
.kept-dl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:0 0 12px}

/* Review: progress, tabs, filters */
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding-bottom:6px}
.progress .bar{flex:1}
.progress span{white-space:nowrap}
.tabs{display:flex;gap:4px;padding:6px 0 10px;flex-wrap:wrap}
.tab{font-size:13px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.tab.on{background:var(--fg);color:var(--bg)}
.filters{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:0 0 12px}
.filters.open{display:grid}
.filters select,.filters input{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.filters input{grid-column:1/-1}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;touch-action:pan-y;transition:transform .2s ease,opacity .2s ease;will-change:transform;position:relative}
.card.drag{transition:none}
.card.out-r{transform:translateX(110%) rotate(6deg)!important;opacity:0}
.card.out-l{transform:translateX(-110%) rotate(-6deg)!important;opacity:0}
.badge{position:absolute;top:14px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;opacity:0;pointer-events:none;background:var(--surface)}
.badge.k{left:14px;color:var(--keep);border:1.5px solid var(--keep)}
.badge.r{right:14px;color:var(--reject);border:1.5px solid var(--reject)}

.author{direction:ltr;text-align:left;display:grid;gap:2px}
.author-name{font-size:15px;font-weight:700;color:var(--fg)}
.author-name:hover{color:var(--accent)}
.author-head{font-size:13px;color:var(--muted);line-height:1.5}
.line{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.line .open-post{margin-left:auto;font-weight:700}
.state{font-weight:700}
.state.k{color:var(--keep)} .state.r{color:var(--reject)}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 10px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tools .stats{margin-inline-end:auto}
.tool-group{display:inline-flex;gap:4px;align-items:center}
.chip-btn{font-size:12px;padding:3px 8px;border-radius:7px;color:var(--muted);border:1px solid var(--line)}
.chip-btn:hover{color:var(--fg);border-color:var(--faint)}
.chip-btn.on{color:var(--fg);background:var(--sunk)}

.kws{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;direction:ltr}
.kw{font:500 11.5px var(--mono);padding:1px 7px;border-radius:6px}
.kw.l1,mark.hl-l1{background:var(--l1-bg);color:var(--l1-fg)}
.kw.l2,mark.hl-l2{background:var(--l2-bg);color:var(--l2-fg)}
.kw.l3,mark.hl-l3{background:var(--l3-bg);color:var(--l3-fg)}
mark{padding:0 3px;border-radius:4px;font-weight:500}
.kw-legend{font-size:11px;color:var(--faint);direction:rtl;width:100%}

.post{font-size:var(--post-size);line-height:1.85;overflow-wrap:anywhere}
.post-para{margin:0 0 .9em}
.post-para:last-child{margin:0}
.post-list-item{margin:0 0 .35em;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.hashtag-block{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 8px;direction:ltr}
.hashtag-chip{font-size:13px;color:var(--muted)}

.attach{margin-top:14px;display:grid;gap:8px}
.art{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;direction:ltr;text-align:left;color:var(--fg)}
.art:hover{border-color:var(--faint);text-decoration:none}
.art b{display:block;font-size:14px}
.art span{display:block;font-size:12.5px;color:var(--muted)}
.art em{font-style:normal;font-size:12px;color:var(--accent)}
.imgs{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.imgs img{max-height:180px;max-width:100%;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.media-tags{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.media-tags a,.media-tags span{font-size:12px;padding:2px 8px;border-radius:7px;background:var(--sunk);color:var(--muted)}

.prov{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.q-row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;direction:ltr}
.q-code{font:600 11.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--fg)}
.fam{font-size:11.5px;padding:1px 8px;border-radius:5px;color:var(--muted);border:1px solid var(--line)}
.formula{font:400 11.5px/1.5 var(--mono);color:var(--muted);direction:ltr;text-align:left}
.eng{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);direction:ltr;margin-top:10px}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.spacer{height:120px}

/* Action bar */
.actions{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;align-items:center;gap:18px}
.act{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.08);transition:transform .12s}
.act:active{transform:scale(.92)}
.act svg{width:28px;height:28px}
.act.k{color:var(--keep)} .act.r{color:var(--reject)}
.act.small{width:44px;height:44px;color:var(--muted);box-shadow:none}
.act.small svg{width:20px;height:20px}
.act:disabled{opacity:.35}
.hint{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11.5px;color:var(--faint);pointer-events:none}
@media (hover:none){.hint{display:none}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- Login -->
<section class="screen" id="loginScreen">
  <form class="login" onsubmit="doLogin(event)">
    <h1>غربالگری پست‌ها</h1>
    <div class="muted" style="font-size:13.5px">رمز تیم را وارد کنید</div>
    <input type="password" id="passwordInput" autocomplete="current-password" required aria-label="رمز تیم">
    <button type="submit" class="primary" id="loginBtn">ورود</button>
    <div class="err" id="loginError"></div>
  </form>
</section>

<!-- Sets -->
<section class="screen" id="setsScreen">
  <div class="head">
    <h1>مجموعه‌ها</h1>
    <a class="text-btn" href="/kept">پست‌های نگه داشته‌شده</a>
  </div>
  <div class="sets" id="setsGrid"><div class="muted">…</div></div>
  <div class="foot">
    <a class="text-btn" href="/api/export">دانلود تصمیم‌ها (JSON)</a>
    <button type="button" class="text-btn" onclick="doLogout()">خروج</button>
  </div>
</section>

<!-- Review -->
<section class="screen" id="reviewScreen">
  <div class="head">
    <button type="button" class="icon-btn" onclick="goSets()" aria-label="بازگشت به مجموعه‌ها">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <h1 id="setTitle">—</h1>
    <a class="text-btn" href="/kept">نگه داشته‌شده</a>
    <button type="button" class="icon-btn" id="filterToggle" onclick="toggleFilters()" aria-label="فیلتر و جستجو">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
    <span class="dot" id="syncDot" title="ذخیره شد"></span>
  </div>
  <div class="progress">
    <span id="progressText" class="ltr">0 / 0</span>
    <div class="bar"><i class="k" id="progKeep"></i><i class="r" id="progReject"></i></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" data-f="unreviewed" onclick="setDecisionFilter('unreviewed')">مانده <span id="cUnrev"></span></button>
    <button type="button" class="tab" data-f="keep" onclick="setDecisionFilter('keep')">بماند <span id="cKeep"></span></button>
    <button type="button" class="tab" data-f="reject" onclick="setDecisionFilter('reject')">حذف <span id="cReject"></span></button>
    <button type="button" class="tab" data-f="all" onclick="setDecisionFilter('all')">همه <span id="cAll"></span></button>
  </div>
  <div class="filters" id="filters">
    <select id="familyFilter" onchange="applyFilters()" aria-label="خانواده">
      <option value="all">همه خانواده‌ها</option>
      <option value="direct">مهارت مستقیم</option>
      <option value="cognition">شناخت و طراحی</option>
      <option value="process">فرآیند و نقش</option>
      <option value="technical_and_pedagogy">فنی و آموزش</option>
    </select>
    <select id="queryFilter" onchange="applyFilters()" aria-label="کوئری"><option value="all">همه کوئری‌ها</option></select>
    <select id="authorTypeFilter" onchange="applyFilters()" aria-label="نوع نویسنده">
      <option value="all">همه نویسندگان</option>
      <option value="profile">فقط افراد</option>
      <option value="company">فقط شرکت‌ها</option>
    </select>
    <select id="sortOrder" onchange="applyFilters()" aria-label="ترتیب">
      <option value="default">ترتیب پیش‌فرض</option>
      <option value="reactions">بیشترین لایک</option>
      <option value="chars_desc">طولانی‌ترین متن</option>
      <option value="date_desc">جدیدترین</option>
    </select>
    <input type="search" id="searchInput" placeholder="جستجو در متن، نام یا عنوان شغلی…" oninput="applyFilters()">
  </div>

  <article class="card" id="card">
    <span class="badge k" id="badgeKeep">بماند</span>
    <span class="badge r" id="badgeReject">حذف</span>
    <div id="cardBody"><div class="empty">…</div></div>
  </article>
  <div class="spacer"></div>

  <div class="hint">→ بماند · ← حذف · ↓ بعدی · Z برگشت</div>
  <!-- RTL: first child sits on the right, so keep (swipe right) comes first -->
  <div class="actions">
    <button type="button" class="act k" onclick="decide('keep')" aria-label="بماند">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </button>
    <button type="button" class="act small" id="undoBtn" onclick="undo()" disabled aria-label="برگشت">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 010 10h-3"/></svg>
    </button>
    <button type="button" class="act small" onclick="skip()" aria-label="بعدی بدون تصمیم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button type="button" class="act r" onclick="decide('reject')" aria-label="حذف">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</section>

<!-- Kept posts (one-by-one) -->
<section class="screen" id="keptScreen">
  <div class="head">
    <button type="button" class="icon-btn" onclick="goSets()" aria-label="بازگشت به مجموعه‌ها">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <h1>پست‌های نگه داشته‌شده</h1>
  </div>
  <div class="filters open" id="keptFilters">
    <select id="keptByFilter" onchange="applyKeptFilter()" aria-label="چه کسی نگه داشته">
      <option value="all">چه کسی نگه داشته: همه</option>
    </select>
  </div>
  <div class="kept-dl">
    <button type="button" class="text-btn" onclick="downloadKept()">دانلود پست‌های نگه داشته‌شده (JSON)</button>
    <span class="muted" style="font-size:12.5px">بدون اینکه چه کسی نگه داشته</span>
  </div>
  <div class="progress">
    <span id="keptProgressText" class="ltr">0 / 0</span>
  </div>
  <article class="card" id="keptCard">
    <div id="keptCardBody"><div class="empty">…</div></div>
  </article>
  <div class="spacer"></div>
  <div class="hint">↓ بعدی · ↑ قبلی</div>
  <div class="actions">
    <button type="button" class="act small" id="keptPrevBtn" onclick="keptPage(-1)" aria-label="پست قبلی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button type="button" class="act small" id="keptNextBtn" onclick="keptPage(1)" aria-label="پست بعدی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
</section>

<script>
const QUERIES = [
  {"id": "Q01", "family": "direct", "operators": 5, "hits": 50, "exclusive": 37, "query": "(architect OR architectural) AND (GenAI OR \"generative AI\") AND (skill OR skills)"},
  {"id": "Q02", "family": "direct", "operators": 5, "hits": 50, "exclusive": 33, "query": "(architect OR architectural) AND (Midjourney OR ChatGPT) AND (skill OR skills)"},
  {"id": "Q03", "family": "direct", "operators": 5, "hits": 50, "exclusive": 46, "query": "(BIM OR Revit) AND (GenAI OR \"generative AI\") AND (skill OR skills)"},
  {"id": "Q04", "family": "direct", "operators": 5, "hits": 50, "exclusive": 46, "query": "(BIM OR Revit) AND (Midjourney OR ChatGPT) AND (skill OR skills)"},
  {"id": "Q05", "family": "direct", "operators": 5, "hits": 50, "exclusive": 45, "query": "(architect OR architectural) AND (GenAI OR \"generative AI\") AND (upskilling OR reskilling)"},
  {"id": "Q06", "family": "direct", "operators": 5, "hits": 50, "exclusive": 46, "query": "(architect OR architectural) AND (Midjourney OR ChatGPT) AND (upskilling OR reskilling)"},
  {"id": "Q07", "family": "direct", "operators": 5, "hits": 13, "exclusive": 7, "query": "(Rhino OR Grasshopper) AND (GenAI OR \"generative AI\") AND (upskilling OR reskilling)"},
  {"id": "Q08", "family": "direct", "operators": 5, "hits": 11, "exclusive": 5, "query": "(Rhino OR Grasshopper) AND (Midjourney OR ChatGPT) AND (upskilling OR reskilling)"},
  {"id": "Q09", "family": "direct", "operators": 5, "hits": 50, "exclusive": 15, "query": "(architect OR architectural) AND (GenAI OR \"generative AI\") AND (deskilling OR \"skill loss\")"},
  {"id": "Q10", "family": "direct", "operators": 5, "hits": 34, "exclusive": 23, "query": "(architect OR architectural) AND (Midjourney OR ChatGPT) AND (deskilling OR \"skill loss\")"},
  {"id": "Q11", "family": "direct", "operators": 5, "hits": 14, "exclusive": 8, "query": "(Parametric OR \"generative design\") AND (GenAI OR \"generative AI\") AND (deskilling OR \"skill loss\")"},
  {"id": "Q12", "family": "direct", "operators": 5, "hits": 10, "exclusive": 5, "query": "(Parametric OR \"generative design\") AND (Midjourney OR ChatGPT) AND (deskilling OR \"skill loss\")"},

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function highlightKeywordsInHtml(safeHtml, detected, enableMarks) {
  const applyLayer = (terms, cls, bucket) => {
    for (const term of terms) {
      const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(\\b${escapedTerm}\\b)`, 'gi');
      if (re.test(safeHtml)) {
        bucket.add(term);
        if (enableMarks) {
          safeHtml = safeHtml.replace(re, `<mark class="${cls}">$1</mark>`);
        }
      }
    }
  };
  applyLayer(LAYER1_TERMS, 'hl-l1', detected.l1);
  applyLayer(LAYER2_TERMS, 'hl-l2', detected.l2);
  applyLayer(LAYER3_TERMS, 'hl-l3', detected.l3);
  return safeHtml;
}

function formatFullPostText(rawText, enableMarks) {
  const detected = { l1: new Set(), l2: new Set(), l3: new Set() };
  const cleaned = String(rawText || '').replace(/\r\n/g, '\n').trim();
  if (!cleaned) {
    return {
      html: `<p class="muted">این پست متن ندارد (فقط تصویر، ویدیو، نظرسنجی یا بازنشر). پیوست‌ها را پایین ببینید یا پست را در لینکدین باز کنید.</p>`,
      detected,
      wordCount: 0,
      lineCount: 0
    };
  }

  const words = cleaned.split(/\s+/).filter(Boolean).length;
  const rawLines = cleaned.split('\n');

  // Separate trailing hashtag-only lines if present at the very end
  const trailingHashtags = [];
  while (rawLines.length > 0) {
    const lastLine = rawLines[rawLines.length - 1].trim();
    if (!lastLine) {
      rawLines.pop();
      continue;
    }
    const tokens = lastLine.split(/\s+/);
    if (tokens.length >= 2 && tokens.every(t => /^#[\w\u0600-\u06FF-]+$/i.test(t))) {
      trailingHashtags.unshift(...tokens);
      rawLines.pop();
    } else {
      break;
    }
  }

  // Group remaining lines into paragraphs separated by blank lines
  const paragraphs = [];
  let currentPara = [];
  for (const line of rawLines) {
    if (!line.trim()) {
      if (currentPara.length) {
        paragraphs.push(currentPara);
        currentPara = [];
      }
    } else {
      currentPara.push(line);
    }
  }
  if (currentPara.length) paragraphs.push(currentPara);

  const bulletRegex = /^(\s*)([•▪▫‣⁃\-–—→➔➢➣➤✓✔✅☑️🔹🔸🚀💡📌🎯🔑✨1-9️⃣]+|\d+[\.\)])\s+/;

  const renderedBlocks = paragraphs.map(paraLines => {
    // Check if lines inside this block are bullet items
    const allBullets = paraLines.length > 1 && paraLines.every(l => bulletRegex.test(l));
    if (allBullets) {
      return paraLines.map(l => {
        let safeLine = escapeHtml(l.trim());
        safeLine = highlightKeywordsInHtml(safeLine, detected, enableMarks);
        return `<div class="post-list-item" dir="auto">${safeLine}</div>`;
      }).join('');
    }

    const innerHtml = paraLines.map(l => {
      const isBullet = bulletRegex.test(l);
      let safeLine = escapeHtml(l);
      safeLine = highlightKeywordsInHtml(safeLine, detected, enableMarks);
      if (isBullet) {
        return `<div class="post-list-item" dir="auto">${safeLine}</div>`;
      }
      return safeLine;
    }).join('<br>');

    return `<div class="post-para" dir="auto">${innerHtml}</div>`;
  });

  // Also scan trailing hashtags for keyword matches
  let hashtagHtml = '';
  if (trailingHashtags.length > 0) {
    const chips = trailingHashtags.map(tag => {
      let safeTag = escapeHtml(tag);
      safeTag = highlightKeywordsInHtml(safeTag, detected, enableMarks);
      return `<span class="hashtag-chip">${safeTag}</span>`;
    }).join('');
    hashtagHtml = `<div class="hashtag-block">${chips}</div>`;
  }

  return {
    html: renderedBlocks.join('') + hashtagHtml,
    detected,
    wordCount: words,
    lineCount: rawLines.length
  };
}

function normalizePostRecord(r) {
  const fams = String(r.matched_families || 'direct').split(',').map(s => s.trim()).filter(Boolean);
  const qCodes = String(r.matched_query_codes || '').split(',').map(s => s.trim()).filter(Boolean);
  const fullText = String(r.post_text ?? r.content ?? '');
  return {
    ...r,
    source: r.source || 'apify',
    source_post_id: String(r.source_post_id || r.id || ''),
    entity_id: r.entity_id || String(r.source_post_id || r.id || ''),
    share_urn: r.share_urn || null,
    post_type: r.post_type || 'post',
    post_url: r.post_url || '',
    share_url: r.share_url || r.post_url || '',
    posted_at: String(r.posted_at || '').slice(0, 10) || '—',
    posted_at_full: r.posted_at || null,
    posted_timestamp_ms: r.posted_timestamp_ms ?? null,
    post_text: fullText,
    text_chars: fullText.length,
    author_id: r.author_id || null,
    author_type: r.author_type || 'profile',
    author_name: r.author_name || '—',
    author_public_id: r.author_public_id || '',
    author_universal_name: r.author_universal_name || null,
    author_url: r.author_url || '',
    author_headline: r.author_headline || '—',
    author_website: r.author_website || null,
    author_urn: r.author_urn || null,
    reactions: Number(r.reactions || 0),
    comments: Number(r.comments || 0),
    shares: Number(r.shares || 0),
    reactions_breakdown: r.reactions_breakdown ?? null,
    content_attributes: r.content_attributes ?? null,
    newsletter_title: r.newsletter_title ?? null,
    newsletter_url: r.newsletter_url ?? null,
    repost_id: r.repost_id ?? null,
    media: r.media || null,
    first_raw_item_id: r.first_raw_item_id ?? null,
    matched_query_count: Number(r.matched_query_count || qCodes.length || 1),
    matched_query_codes: qCodes.join(','),
    query_list: qCodes,
    matched_families: fams.join(','),
    families: fams,
    primary_family: fams[0] || 'direct'
  };
}

// ---- Saving: immediate PUT with an offline retry queue ----
let queue = store.get(QUEUE_KEY, []), flushing = false;
function setDot(state) {
  const d = $('syncDot');
  d.className = 'dot' + (state === 'ok' ? '' : ' ' + state);
  d.title = state === 'ok' ? 'ذخیره شد' : state === 'wait' ? 'در حال ذخیره…' : 'ذخیره نشد — دوباره تلاش می‌شود';
}
function save(id, status) {
  queue = queue.filter(q => q.source_post_id !== id);
  queue.push({ source_post_id: id, status, by: SET_ID });
  store.set(QUEUE_KEY, queue);
  flushQueue();
}
async function flushQueue() {
  if (flushing) return;
  if (!queue.length) { setDot('ok'); return; }
  flushing = true; setDot('wait');
  try {
    while (queue.length) {
      const res = await api('/api/decision', { method: 'PUT', body: JSON.stringify(queue[0]) });
      if (!res.ok && res.status !== 404) throw new Error('HTTP ' + res.status);
      queue.shift(); store.set(QUEUE_KEY, queue);
    }
    setDot('ok');
  } catch (e) { setDot('bad'); setTimeout(flushQueue, 4000); }
  finally { flushing = false; }
}
window.addEventListener('online', flushQueue);

function setDecisionFilter(f) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.f === f));
  applyFilters();

function applyFilters() {
  const fam = $('familyFilter').value, qId = $('queryFilter').value, aType = $('authorTypeFilter').value;
  const sortKey = $('sortOrder').value, term = $('searchInput').value.trim().toLowerCase();
  VIEW = POSTS.filter(p => {
    const d = decisions[p.source_post_id] || 'unreviewed';
    if (filter !== 'all' && d !== filter) return false;
    if (fam !== 'all' && !p.families.includes(fam)) return false;
    if (qId !== 'all' && !p.query_list.includes(qId)) return false;
    if (aType !== 'all' && p.author_type !== aType) return false;
    if (term && !`${p.post_text} ${p.author_name} ${p.author_headline} ${p.matched_query_codes}`.toLowerCase().includes(term)) return false;
    return true;
  });
  if (sortKey === 'reactions') VIEW.sort((a, b) => b.reactions - a.reactions);
  else if (sortKey === 'chars_desc') VIEW.sort((a, b) => b.text_chars - a.text_chars);
  else if (sortKey === 'date_desc') VIEW.sort((a, b) => String(b.posted_at).localeCompare(String(a.posted_at)));
  idx = 0;
  render();
}

function updateStats() {
  let k = 0, r = 0;
  for (const p of POSTS) { const d = decisions[p.source_post_id]; if (d === 'keep') k++; else if (d === 'reject') r++; }
  const t = POSTS.length;
  $('progressText').textContent = `${fa(k + r)} / ${fa(t)}`;
  $('progKeep').style.width = t ? `${k / t * 100}%` : '0';
  $('progReject').style.width = t ? `${r / t * 100}%` : '0';
  $('cUnrev').textContent = fa(t - k - r);
  $('cKeep').textContent = fa(k);
  $('cReject').textContent = fa(r);
  $('cAll').textContent = fa(t);
  $('undoBtn').disabled = !history.length;
}

function copyText() {
  const p = $('keptScreen').classList.contains('active') ? KEPT_VIEW[keptIdx] : VIEW[idx];
  if (p) navigator.clipboard.writeText(p.post_text || '').then(() => toast('متن کپی شد'));
}

// ---- Attachments (article, images, video, document, poll, repost) ----
function attachmentsHtml(media) {
  if (!media) return '';
  let m;
  try { m = typeof media === 'string' ? JSON.parse(media) : media; } catch (e) { return ''; }
  let out = '';
  if (m.article && (m.article.title || m.article.link)) {
    const a = m.article;
    const inner = `<b>${esc(a.title || a.link)}</b>${a.subtitle ? `<span>${esc(a.subtitle)}</span>` : ''}${a.description ? `<span>${esc(a.description)}</span>` : ''}${a.link ? `<em>${esc(a.link.replace(/^https?:\/\//, '').slice(0, 60))} ↗</em>` : ''}`;
    out += a.link ? `<a class="art" href="${esc(a.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="art">${inner}</div>`;
  }
  if (Array.isArray(m.postImages)) {
    const imgs = m.postImages.filter(i => i && i.url).slice(0, 6)
      .map(i => `<a href="${esc(i.url)}" target="_blank" rel="noopener"><img src="${esc(i.url)}" alt="" loading="lazy"></a>`).join('');
    if (imgs) out += `<div class="imgs">${imgs}</div>`;
  }
  const tags = [];
  const linkOf = o => o && (o.url || o.link || o.linkedinUrl || o.coverPages?.[0]);
  if (m.postVideo) { const u = linkOf(m.postVideo) || linkOf(m.postVideo[0]); tags.push(u ? `<a href="${esc(u)}" target="_blank" rel="noopener">▶ Video</a>` : '<span>▶ Video</span>'); }
  if (m.document) { const u = linkOf(m.document); tags.push(u ? `<a href="${esc(u)}" target="_blank" rel="noopener">📄 ${esc(m.document.title || 'Document')}</a>` : `<span>📄 ${esc(m.document.title || 'Document')}</span>`); }
  if (m.poll) tags.push(`<span>📊 Poll${m.poll.question ? ': ' + esc(m.poll.question) : ''}</span>`);
  if (m.repost) { const u = linkOf(m.repost); tags.push(u ? `<a href="${esc(u)}" target="_blank" rel="noopener">🔁 Repost</a>` : '<span>🔁 Repost</span>'); }
  if (tags.length) out += `<div class="media-tags">${tags.join('')}</div>`;
  return out ? `<div class="attach">${out}</div>` : '';
}

// ---- Card ----
function postCardHtml(p, { index, total, statusHtml }) {
  const { html, detected, wordCount, lineCount } = formatFullPostText(p.post_text || '', highlightOn);
  const kwPills = [
    ...[...detected.l1].map(w => `<span class="kw l1" title="لایه ۱: معماری / ابزار">${esc(w)}</span>`),
    ...[...detected.l2].map(w => `<span class="kw l2" title="لایه ۲: هوش مصنوعی">${esc(w)}</span>`),
    ...[...detected.l3].map(w => `<span class="kw l3" title="لایه ۳: مهارت / شناخت / فرآیند">${esc(w)}</span>`)
  ].join('');
  const qBadges = p.query_list.map(c => `<span class="q-code">${esc(c)}</span>`).join('') +
    p.families.map(f => `<span class="fam">${esc(FAMILY_LABELS[f] || f)}</span>`).join('');
  const formulas = p.query_list.map(c => QUERY_BY_ID[c] ? `${c}: ${QUERY_BY_ID[c].query}` : c).join('\n');
  const authorName = esc(p.author_name || '—');
  return `
    <div class="author">
      <div>${p.author_type === 'company' ? '🏢' : '👤'} ${p.author_url ? `<a class="author-name" href="${esc(p.author_url)}" target="_blank" rel="noopener">${authorName}</a>` : `<span class="author-name">${authorName}</span>`}</div>
      ${p.author_headline && p.author_headline !== '—' ? `<div class="author-head">${esc(p.author_headline)}</div>` : ''}
    </div>
    <div class="line">
      <span>${fa(index + 1)} / ${fa(total)}</span>
      ${p.posted_at && p.posted_at !== '—' ? `<span>${esc(p.posted_at)}</span>` : ''}
      ${p.post_type && p.post_type !== 'post' ? `<span>${esc(p.post_type)}</span>` : ''}
      ${statusHtml || ''}
      ${p.post_url ? `<a class="open-post" href="${esc(p.post_url)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ''}
    </div>
    <div class="tools">
      <span class="stats">${fa(wordCount)} کلمه · ${fa(p.text_chars)} کاراکتر · ${fa(lineCount)} خط</span>
      <span class="tool-group">
        <button type="button" class="chip-btn${highlightOn ? ' on' : ''}" onclick="toggleHighlight()">هایلایت</button>
        <button type="button" class="chip-btn" onclick="copyText()">کپی</button>
        <span class="tool-group ltr">
          <button type="button" class="chip-btn" onclick="adjustFontSize(-1)" aria-label="کوچک‌تر">A−</button>
          <button type="button" class="chip-btn" onclick="adjustFontSize(0)" aria-label="اندازهٔ پیش‌فرض">A</button>
          <button type="button" class="chip-btn" onclick="adjustFontSize(1)" aria-label="بزرگ‌تر">A+</button>
        </span>
      </span>
    </div>
    ${kwPills
      ? `<div class="kws">${kwPills}<div class="kw-legend">آبی: معماری · بنفش: هوش مصنوعی · سبز: مهارت و شناخت</div></div>`
      : `<div class="kws"><span class="kw-legend">کلیدواژهٔ مستقیمی در متن نیست (شاید در لینک، عنوان یا بازنشر باشد)</span></div>`}
    <div class="post">${html}</div>
    ${attachmentsHtml(p.media)}
    <div class="prov">
      <div class="q-row">${qBadges}</div>
      ${formulas ? `<div class="formula">${esc(formulas).replace(/\n/g, '<br>')}</div>` : ''}
    </div>
    <div class="eng">
      <span>👍 ${fa(p.reactions)}</span><span>💬 ${fa(p.comments)}</span><span>🔁 ${fa(p.shares)}</span>
      <span>${p.author_type === 'company' ? 'Company page' : 'Personal profile'}</span>
    </div>`;
}

function render() {
  updateStats();
  const body = $('cardBody');
  if (!VIEW.length || idx >= VIEW.length) {
    body.innerHTML = `<div class="empty">${filter === 'unreviewed' && POSTS.length ? 'همهٔ پست‌های این بخش بررسی شد 🎉' : 'پستی با این فیلتر نیست'}</div>`;
    return;
  }
  const p = VIEW[idx];
  const d = decisions[p.source_post_id];
  const statusHtml = d ? `<span class="state ${d === 'keep' ? 'k' : 'r'}">${d === 'keep' ? '✓ بماند' : '✕ حذف'}</span>` : '';
  body.innerHTML = postCardHtml(p, { index: idx, total: VIEW.length, statusHtml });
}

// ---- Decisions ----
function decide(status) {
  if (!VIEW.length || idx >= VIEW.length) return;
  const p = VIEW[idx], card = $('card');
  history.push({ id: p.source_post_id, prev: decisions[p.source_post_id] || null });
  decisions[p.source_post_id] = status;
  save(p.source_post_id, status);
  card.classList.add(status === 'keep' ? 'out-r' : 'out-l');
  setTimeout(() => {
    card.classList.remove('out-r', 'out-l');
    card.style.transform = '';
    $('badgeKeep').style.opacity = 0; $('badgeReject').style.opacity = 0;
    if (filter !== 'all' && filter !== status) { VIEW.splice(idx, 1); if (idx >= VIEW.length) idx = Math.max(0, VIEW.length - 1); }
    else idx++;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 200);
}

function undo() {
  const last = history.pop();
  if (!last) return;
  if (last.prev) decisions[last.id] = last.prev; else delete decisions[last.id];
  save(last.id, last.prev);
  const p = POSTS.find(x => x.source_post_id === last.id);
  const at = VIEW.findIndex(x => x.source_post_id === last.id);
  if (at !== -1) idx = at;
  else if (p) VIEW.splice(idx, 0, p);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function skip() { if (VIEW.length) { idx = (idx + 1) % VIEW.length; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }

// ---- Kept posts viewer ----
function fillKeptByFilter() {
  const sel = $('keptByFilter');
  const prev = keptBy;
  sel.innerHTML = '<option value="all">چه کسی نگه داشته: همه</option>';
  for (const r of KEPT_REVIEWERS) {
    const n = KEPT_POSTS.filter(p => Number(p.kept_by) === Number(r.id)).length;
    const o = document.createElement('option');
    o.value = String(r.id);
    o.textContent = `چه کسی نگه داشته: ${r.name} (${fa(n)})`;
    sel.appendChild(o);
  }
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : 'all';
  keptBy = sel.value;
}

async function showKept() {
  showScreen('keptScreen');
  $('keptCardBody').innerHTML = '<div class="empty">در حال بارگذاری…</div>';
  try {
    const res = await api('/api/kept');
    if (!res.ok) throw new Error('load failed');
    const data = await res.json();
    KEPT_REVIEWERS = data.reviewers || [];
    KEPT_POSTS = (data.posts || []).map(p => normalizePostRecord({
      ...p,
      source_post_id: String(p.source_post_id),
      kept_by: p.kept_by,
      kept_by_name: p.kept_by_name,
      kept_by_name_en: p.kept_by_name_en
    }));
    fillKeptByFilter();
    applyKeptFilter();
  } catch (e) {
    if (e.message !== 'unauthorized') $('keptCardBody').innerHTML = '<div class="empty">بارگذاری نشد — دوباره باز کنید</div>';
  }
}

function applyKeptFilter() {
  keptBy = $('keptByFilter').value;
  KEPT_VIEW = keptBy === 'all' ? KEPT_POSTS.slice() : KEPT_POSTS.filter(p => String(p.kept_by) === keptBy);
  keptIdx = 0;
  renderKept();
}

function renderKept() {
  const body = $('keptCardBody');
  const total = KEPT_VIEW.length;
  $('keptProgressText').textContent = `${fa(total ? keptIdx + 1 : 0)} / ${fa(total)}`;
  $('keptPrevBtn').disabled = total < 2;
  $('keptNextBtn').disabled = total < 2;
  if (!total) {
    body.innerHTML = `<div class="empty">${KEPT_POSTS.length ? 'پستی با این فیلتر نیست' : 'هنوز پستی نگه داشته نشده'}</div>`;
    return;
  }
  if (keptIdx >= total) keptIdx = total - 1;
  const p = KEPT_VIEW[keptIdx];
  const who = p.kept_by_name ? esc(p.kept_by_name) : '';
  const statusHtml = `<span class="state k">✓ بماند${who ? ' · ' + who : ''}</span>`;
  body.innerHTML = postCardHtml(p, { index: keptIdx, total, statusHtml });
}

function keptPage(delta) {
  if (!KEPT_VIEW.length) return;
  keptIdx = (keptIdx + delta + KEPT_VIEW.length) % KEPT_VIEW.length;
  renderKept();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function downloadKept() {
  try {
    const q = keptBy === 'all' ? '' : `?by=${encodeURIComponent(keptBy)}`;
    const res = await api('/api/kept/export' + q);
    if (!res.ok) throw new Error('export failed');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'saintiment_kept_posts.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('دانلود شد');
  } catch (e) {
    if (e.message !== 'unauthorized') toast('دانلود نشد');
  }
}

// ---- Swipe gestures (anywhere on the card, including over the text) ----
(function () {
  const card = $('card'), bk = $('badgeKeep'), br = $('badgeReject');
  let x0 = 0, y0 = 0, dx = 0, tracking = false, horiz = false;
  const start = (x, y, t) => { if (t.closest('a,button,input,select,label')) return; x0 = x; y0 = y; dx = 0; tracking = true; horiz = false; };
  const move = (x, y) => {
    if (!tracking) return;
    const ddx = x - x0, ddy = y - y0;
    if (!horiz) {
      if (Math.abs(ddy) > 20 && Math.abs(ddy) > Math.abs(ddx)) { tracking = false; return; }
      if (Math.abs(ddx) > 16 && Math.abs(ddx) > Math.abs(ddy) * 1.3) { horiz = true; card.classList.add('drag'); window.getSelection()?.removeAllRanges(); }
      else return;
    }
    dx = ddx;
    card.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
    const o = Math.min(1, Math.abs(dx) / 100);
    bk.style.opacity = dx > 0 ? o : 0;
    br.style.opacity = dx < 0 ? o : 0;
  };
  const end = () => {
    if (!tracking) return;
    tracking = false; card.classList.remove('drag');
    if (horiz && dx > 100) decide('keep');
    else if (horiz && dx < -100) decide('reject');
    else { card.style.transform = ''; bk.style.opacity = 0; br.style.opacity = 0; }
  };
  card.addEventListener('mousedown', e => start(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  window.addEventListener('mouseup', end);
  card.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
  card.addEventListener('touchmove', e => { if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  card.addEventListener('touchend', end);
})();

// ---- Keyboard (same keys as the original page) ----
window.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  const k = e.key;
  if ($('keptScreen').classList.contains('active')) {
    if (k === 'ArrowDown' || k === 'ArrowLeft' || k === ' ') { e.preventDefault(); keptPage(1); }
    else if (k === 'ArrowUp' || k === 'ArrowRight') { e.preventDefault(); keptPage(-1); }
    return;
  }
  if (!$('reviewScreen').classList.contains('active')) return;
  if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'Enter') { e.preventDefault(); decide('keep'); }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); decide('reject'); }
  else if (k === 'ArrowDown' || k === ' ') { e.preventDefault(); skip(); }
  else if (k === 'z' || k === 'Z' || k === 'Backspace') { e.preventDefault(); undo(); }
});

window.addEventListener('popstate', () => {
  if (onKeptPath()) showKept();
  else if ($('loginScreen').classList.contains('active')) return;
  else showSets();
});

document.addEventListener('click', e => {
  const a = e.target.closest('a[href="/kept"]');
  if (!a) return;
  e.preventDefault();
  goKept();
});

// ---- Boot ----
(async () => {
  try {
    const res = await fetch('/api/me', { credentials: 'same-origin' });
    if (res.ok) await (onKeptPath() ? showKept() : showSets());
    else showScreen('loginScreen');
  } catch (e) { showScreen('loginScreen'); }
})();
</script>
