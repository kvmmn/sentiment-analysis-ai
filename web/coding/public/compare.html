<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقایسهٔ کدگذاری‌ها · Saintiment</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--sunk:#efede8;--line:#e4e1da;--ink:#1d2127;--muted:#6a6e75;--faint:#9a9da3;
  --agree:#f4c542;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:50px}
.top h1{font-size:15px;margin:0 0 0 6px}
.nav a{padding:3px 8px;border-radius:4px;color:var(--muted);text-decoration:none;font-size:12.5px}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current]{color:var(--ink);font-weight:600}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:12.5px;user-select:none}
.chip[aria-pressed=false]{opacity:.4}
.chip[aria-pressed=false] .dot{background:#bbb!important}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;height:calc(100vh - 51px)}
.posts{border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
.posts .head{position:sticky;top:0;background:var(--panel);display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.posts button{display:flex;width:100%;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--sunk);background:none;padding:6px 12px;text-align:start;cursor:pointer}
.posts button:hover{background:var(--sunk)}
.posts button[aria-current=true]{background:#eef0f7;box-shadow:inset -3px 0 0 var(--ink)}
.sid{font-weight:600;font-variant-numeric:tabular-nums;min-width:30px}
.bars{display:flex;gap:3px;flex:1;justify-content:flex-end}
.n{font-size:11px;min-width:20px;text-align:center;border-radius:3px;padding:0 3px;font-variant-numeric:tabular-nums}
.ov{font-size:11px;color:var(--muted);min-width:32px;text-align:end;font-variant-numeric:tabular-nums}
.reader{overflow:auto;padding:22px 30px 80px}
.wrap{max-width:860px;margin:0 auto}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--ink);font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.text{direction:ltr;text-align:left;padding:24px 30px;font:16.5px/2.25 Georgia,"Iowan Old Style","Times New Roman",serif;color:#24282e}
.text p{margin:0 0 16px;white-space:pre-wrap}
.text p:last-child{margin-bottom:0}
.s{cursor:pointer;padding-bottom:10px;background-repeat:no-repeat;border-radius:2px;transition:opacity .15s}
.s.sel,.s.hot{box-shadow:0 0 0 2px var(--ink);border-radius:3px}
.dim{opacity:.28}
.lbls{display:inline;white-space:normal}
.lbl{display:inline-block;vertical-align:2px;margin:0 0 0 3px;padding:0 6px 0 5px;border-radius:4px;font:600 11px/17px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-left:3px solid var(--c);cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.hide-lbl .lbls{display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px 0;align-items:center}
.sw{display:inline-block;width:22px;height:9px;vertical-align:middle;margin-inline-end:5px;border-radius:2px}
h2{font-size:13.5px;margin:26px 0 10px;font-weight:650}
h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:6px}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.cmp th{position:sticky;top:-22px;background:var(--sunk);font-weight:600;text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);z-index:1}
.cmp th:first-child{border-top-right-radius:10px}.cmp th:last-child{border-top-left-radius:10px}
.cmp td{padding:8px 10px;border-bottom:1px solid var(--sunk);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.cmp tr{cursor:pointer}
.cmp tbody tr:hover td{background:#fbfaf6}
.cmp td.pass{direction:ltr;text-align:left;color:#3a3f46;font:13px/1.55 Georgia,serif;width:38%}
.cmp td.k{width:7%;text-align:center}
.cmp .none{color:#c9c9c9}
.tag{display:inline-block;margin:1px 0 1px 3px;padding:0 7px;border-radius:4px;font-size:12px;line-height:20px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);direction:ltr}
.th{display:block;font-size:11px;color:var(--faint);direction:ltr;text-align:left}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;line-height:18px;white-space:nowrap}
.b-all{background:#fff3c4;color:#7a5b00}.b-some{background:#eef0f7;color:#44506b}.b-one{background:var(--sunk);color:var(--muted)}
.side{border-right:1px solid var(--line);overflow:auto;background:var(--panel);padding:16px}
.side h2:first-child{margin-top:0}
.box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.empty{color:var(--muted);font-size:12.5px}
.hit{padding:6px 0;border-bottom:1px dashed var(--line)}
.hit:last-child{border-bottom:0}
.who{font-weight:650;font-size:12.5px;color:var(--c);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.q{direction:ltr;text-align:left;font:12.5px/1.5 Georgia,serif;color:#444;margin-top:3px}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;font-size:12.5px;align-items:center}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);opacity:.55}
.memo{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.memo header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--sunk);font-size:12.5px;font-weight:600}
.memo header span.cnt{margin-inline-start:auto;font-weight:400;color:var(--muted);font-size:11.5px}
.memo pre{margin:0;padding:8px 10px;white-space:pre-wrap;direction:ltr;text-align:left;font:12px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#444}
.center{display:grid;place-items:center;height:calc(100vh - 51px)}
.login{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:320px;display:grid;gap:10px}
.login input{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.login button,.btn{border:0;border-radius:6px;padding:8px 12px;background:var(--ink);color:#fff;cursor:pointer}
.err{color:#c92a2a;font-size:12.5px;min-height:1em}
.flash{animation:flash 1.3s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--agree)}100%{box-shadow:0 0 0 0 transparent}}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
@media (max-width:1150px){.layout{grid-template-columns:190px minmax(0,1fr);height:auto}.side{grid-column:1/-1;border-right:0;border-top:1px solid var(--line)}.posts{max-height:calc(100vh - 51px);position:sticky;top:51px}}
</style>
</head>
<body>
<div class="top">
  <h1>مقایسهٔ کدگذاری‌ها</h1>
  <nav class="nav" aria-label="بخش‌های پروژه"><a href="/">غربالگری</a><a href="/kept">منتخب‌ها</a><a href="/code/">کدگذاری</a><a href="/code/compare.html" aria-current="page">مقایسه</a></nav>
  <span class="spacer"></span>
  <div id="coderChips" style="display:flex;gap:6px"></div>
  <div class="seg" role="group" aria-label="کدام بخش‌ها">
    <button type="button" data-mode="all" aria-pressed="true">همه</button>
    <button type="button" data-mode="shared" aria-pressed="false" title="فقط عبارت‌هایی که دو نفر یا بیشتر کد گذاشته‌اند">مشترک</button>
    <button type="button" data-mode="single" aria-pressed="false" title="فقط عبارت‌هایی که فقط یک نفر کد گذاشته">تک‌نفره</button>
  </div>
  <button type="button" class="chip" id="syncBtn" title="داده‌ها مستقیم از پایگاه داده خوانده می‌شود؛ هر ۳۰ ثانیه و هر بار که به این زبانه برمی‌گردید خودکار به‌روز می‌شود">⟳ <span id="syncTxt">—</span></button>
  <div class="seg" role="group" aria-label="برچسب‌ها"><button type="button" id="lblBtn" aria-pressed="true" title="نام کدها داخل متن (کلید L)">نام کدها در متن</button></div>
</div>
<div id="app"><div class="center empty">در حال بارگذاری…</div></div>

<script>
(() => {
const CC = { 1:'#2563c9', 2:'#c2410c', 3:'#15803d' };            // one colour per coder
const app = document.getElementById('app');
const S = { data:null, sid:null, on:new Set([1,2,3]), mode:'all', sel:null, labels:true };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paras = t => String(t || '').split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
const num = v => v == null ? null : Number(v);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const D = () => S.data;
const name = id => D().coders.find(c => c.id === id)?.name || ('کدگذار ' + id);
const codeOf = h => D().codes.get(h.code_id);
const themeOf = c => (c && c.theme_id && D().themes.get(c.theme_id)) || '';
const tag = (h, withTheme) => { const c = codeOf(h); return `<span class="tag" style="--c:${CC[h.coder_id]}">${esc(c?.label || '؟')}</span>${withTheme && themeOf(c) ? `<span class="th">${esc(themeOf(c))}</span>` : ''}`; };

async function api(path, opts) {
  const r = await fetch(path, { credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { const e = new Error('unauthorized'); e.status = 401; throw e; }
  if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw new Error('HTTP ' + r.status);
  return r.json();
}

function showLogin(msg) {
  app.innerHTML = `<div class="center"><form class="login" id="lf"><b>ورود تیم</b>
    <input type="password" id="pw" placeholder="رمز تیم" autocomplete="current-password" required>
    <button type="submit">ورود</button><div class="err" id="le">${esc(msg || '')}</div></form></div>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    try { await api('/api/coding/login', { method:'POST', body:JSON.stringify({ password:document.getElementById('pw').value }) }); load(); }
    catch (err) { document.getElementById('le').textContent = err.status === 401 ? 'رمز اشتباه است.' : 'خطا در اتصال: ' + err.message; }
  };
}

let lastSig = '', lastAt = 0, busy = false;
const sig = d => JSON.stringify([d.posts.map(p => [p.sample_id, p.post_text]), d.codes, d.themes, d.highlights, d.post_status]);
function syncText(err) {
  const el = document.getElementById('syncTxt'); if (!el) return;
  if (err) { el.textContent = 'به‌روزرسانی نشد'; el.style.color = '#c92a2a'; return; }
  el.style.color = '';
  el.textContent = 'به‌روز ' + new Date(lastAt).toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

async function load() {
  app.innerHTML = '<div class="center empty">در حال بارگذاری…</div>';
  try {
    const d = await api('/api/coding/export');
    lastSig = sig(d); lastAt = Date.now(); prepare(d);
    const h = decodeURIComponent(location.hash.slice(1));
    S.sid = D().posts.some(p => p.sample_id === h) ? h : D().posts[0]?.sample_id;
    render(); syncText();
  } catch (e) {
    if (e.status === 401) return showLogin();
    app.innerHTML = `<div class="center"><div class="login"><b>داده‌ها بارگذاری نشد</b><div class="err">${esc(e.message)}</div><button class="btn" id="rt">تلاش دوباره</button></div></div>`;
    document.getElementById('rt').onclick = load;
  }
}

// Live sync: re-read the database and redraw only when something changed (new posts, edits, codes added or removed).
async function refresh(force) {
  if (!D() || busy) return;
  busy = true;
  try {
    const d = await api('/api/coding/export');
    lastAt = Date.now();
    const sg = sig(d);
    if (force || sg !== lastSig) {
      lastSig = sg; prepare(d);
      if (!D().posts.some(p => p.sample_id === S.sid)) S.sid = D().posts[0]?.sample_id;
      const g = S.sel; render(true);
      const p = D().posts.find(x => x.sample_id === S.sid);
      if (g != null && p && passages(p)[g]) select(p, g);
    }
    syncText();
  } catch (e) {
    if (e.status === 401) return showLogin('نشست منقضی شده؛ دوباره وارد شوید.');
    syncText(true);
  } finally { busy = false; }
}
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastAt > 5000) refresh(); });
window.addEventListener('focus', () => { if (Date.now() - lastAt > 5000) refresh(); });
document.getElementById('syncBtn').onclick = () => refresh(true);

function prepare(d) {
  const coders = d.coders.map(c => ({ id:num(c.id), name:c.name, name_en:c.name_en }));
  const codes = new Map(d.codes.map(c => [num(c.id), { ...c, id:num(c.id), coder_id:num(c.coder_id), theme_id:num(c.theme_id) }]));
  const themes = new Map(d.themes.map(t => [num(t.id), t.name]));
  const byPost = new Map();
  for (const r of d.highlights) {
    const h = { ...r, id:num(r.id), coder_id:num(r.coder_id), code_id:num(r.code_id), paragraph_idx:num(r.paragraph_idx), start_offset:num(r.start_offset), end_offset:num(r.end_offset) };
    if (!byPost.has(h.sample_id)) byPost.set(h.sample_id, []);
    byPost.get(h.sample_id).push(h);
  }
  const status = new Map(d.post_status.map(s => [num(s.coder_id) + '|' + s.sample_id, s]));
  S.data = { coders, codes, themes, posts:d.posts, byPost, status };
  for (const p of d.posts) { p._P = paras(p.post_text); p._stats = stats(p); }
}

// Highlights that sit inside the post body (anchored to a paragraph).
const anchored = (p, onlyOn) => (D().byPost.get(p.sample_id) || []).filter(h => h.source === 'post' && h.paragraph_idx >= 0 && h.paragraph_idx < p._P.length && h.end_offset > h.start_offset && (!onlyOn || S.on.has(h.coder_id)));

function stats(p) {
  const sets = { 1:new Set(), 2:new Set(), 3:new Set() };
  for (const h of anchored(p)) for (let i = h.start_offset; i < h.end_offset; i++) sets[h.coder_id]?.add(h.paragraph_idx + ':' + i);
  const pair = (a, b) => { const A = sets[a], B = sets[b]; if (!A.size || !B.size) return null; let x = 0; for (const k of A) if (B.has(k)) x++; return x / (A.size + B.size - x); };
  const all = D().byPost.get(p.sample_id) || [];
  const counts = {}; for (const c of [1,2,3]) counts[c] = all.filter(h => h.coder_id === c).length;
  return { counts, pairs:{ '1-2':pair(1,2), '1-3':pair(1,3), '2-3':pair(2,3) } };
}

// Group overlapping highlights (any coder) into passages: one comparison row each.
function passages(p) {
  const hs = anchored(p, true).sort((a, b) => a.paragraph_idx - b.paragraph_idx || a.start_offset - b.start_offset);
  const out = [];
  for (const h of hs) {
    const last = out[out.length - 1];
    if (last && last.p === h.paragraph_idx && h.start_offset < last.end) { last.hs.push(h); last.end = Math.max(last.end, h.end_offset); }
    else out.push({ p:h.paragraph_idx, start:h.start_offset, end:h.end_offset, hs:[h] });
  }
  for (const g of out) { g.coders = new Set(g.hs.map(h => h.coder_id)); g.text = p._P[g.p].slice(g.start, g.end); }
  return out;
}
const visibleByMode = n => S.mode === 'all' || (S.mode === 'shared' ? n >= 2 : n === 1);

function bandStyle(ids) {
  const L = [], Z = [], P = [];
  for (const c of [1,2,3]) if (ids.has(c)) { L.push(`linear-gradient(${CC[c]},${CC[c]})`); Z.push('100% 3px'); P.push(`0 calc(100% - ${(c - 1) * 4}px)`); }
  const tint = ids.size >= 2 ? '#f4c54240' : CC[[...ids][0]] + '1c';
  L.push(`linear-gradient(${tint},${tint})`); Z.push('100% calc(100% - 13px)'); P.push('0 0');
  return `background-image:${L.join(',')};background-size:${Z.join(',')};background-position:${P.join(',')}`;
}

function renderText(p) {
  const hs = anchored(p, true), groups = passages(p);
  const groupOf = h => groups.find(g => g.hs.includes(h));
  return p._P.map((t, pi) => {
    const mine = hs.filter(h => h.paragraph_idx === pi);
    const cuts = new Set([0, t.length]); mine.forEach(h => { cuts.add(Math.min(h.start_offset, t.length)); cuts.add(Math.min(h.end_offset, t.length)); });
    const pts = [...cuts].sort((a, b) => a - b);
    let html = '';
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const cover = mine.filter(h => h.start_offset <= a && h.end_offset >= b);
      const txt = esc(t.slice(a, b));
      if (!cover.length) html += txt;
      else {
        const ids = new Set(cover.map(h => h.coder_id));
        const g = groupOf(cover[0]), gi = groups.indexOf(g);
        const tip = [1,2,3].filter(c => ids.has(c)).map(c => name(c) + ': ' + cover.filter(h => h.coder_id === c).map(h => codeOf(h)?.label || '؟').join('، ')).join('\n');
        html += `<span class="s${visibleByMode(g.coders.size) ? '' : ' dim'}${S.sel === gi ? ' sel' : ''}" data-g="${gi}" data-hls="${cover.map(h => h.id).join(',')}" title="${esc(tip)}" style="${bandStyle(ids)}">${txt}</span>`;
      }
      // code labels for every highlight that ends here, in coder order
      const ending = mine.filter(h => Math.min(h.end_offset, t.length) === b).sort((x, y) => x.coder_id - y.coder_id || x.id - y.id);
      if (ending.length) html += '<span class="lbls">' + ending.map(h => {
        const g = groupOf(h);
        return `<span class="lbl${visibleByMode(g.coders.size) ? '' : ' dim'}" style="--c:${CC[h.coder_id]}" data-hl="${h.id}" data-g="${groups.indexOf(g)}" title="${esc(name(h.coder_id) + ' · ' + (themeOf(codeOf(h)) || 'بدون تم'))}">${esc(codeOf(h)?.label || '؟')}</span>`;
      }).join('') + '</span>';
    }
    return '<p>' + html + '</p>';
  }).join('');
}

function renderTable(p) {
  const groups = passages(p), coders = D().coders.filter(c => S.on.has(c.id));
  const rows = groups.map((g, gi) => {
    if (!visibleByMode(g.coders.size)) return '';
    const n = g.coders.size, allOn = n === coders.length && n > 1;
    const badge = n === 1 ? `<span class="badge b-one">فقط ${esc(name([...g.coders][0]))}</span>` : `<span class="badge ${allOn ? 'b-all' : 'b-some'}">${allOn ? 'همه' : n + ' نفر'}</span>`;
    const cells = coders.map(c => { const hs = g.hs.filter(h => h.coder_id === c.id); return `<td>${hs.length ? hs.map(h => tag(h, true)).join('') : '<span class="none">—</span>'}</td>`; }).join('');
    const txt = g.text.length > 220 ? g.text.slice(0, 220) + '…' : g.text;
    return `<tr data-g="${gi}"><td class="k">${badge}</td><td class="pass">${esc(txt)}</td>${cells}</tr>`;
  }).join('');
  // highlights without a place in the post body (memo-only quotes or external sources)
  const loose = (D().byPost.get(p.sample_id) || []).filter(h => S.on.has(h.coder_id) && !anchored(p).includes(h));
  const looseRows = loose.length ? `<tr><td class="k"><span class="badge b-one">بیرون از متن</span></td><td class="pass">${loose.map(h => esc(h.quote)).join('<br>')}</td>${coders.map(c => `<td>${loose.filter(h => h.coder_id === c.id).map(h => tag(h, true)).join('') || '<span class="none">—</span>'}</td>`).join('')}</tr>` : '';
  if (!rows && !looseRows) return '<p class="empty">در این حالت چیزی برای مقایسه نیست.</p>';
  return `<div class="card" style="overflow:visible"><table class="cmp"><thead><tr><th></th><th>عبارت</th>${coders.map(c => `<th><span class="dot" style="background:${CC[c.id]}"></span> ${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${rows}${looseRows}</tbody></table></div>`;
}

function selBox(p) {
  if (S.sel == null) return '<div class="box empty">روی یک عبارت یا نام کد در متن بزنید تا کدهای همه برای همان بخش اینجا بیاید.</div>';
  const g = passages(p)[S.sel]; if (!g) return '<div class="box empty">—</div>';
  return '<div class="box">' + [1,2,3].filter(c => g.coders.has(c)).map(c => `<div class="hit"><div class="who" style="--c:${CC[c]}"><span class="dot" style="background:${CC[c]}"></span>${esc(name(c))}</div>${g.hs.filter(h => h.coder_id === c).map(h => tag(h, true) + `<div class="q">“${esc(h.quote)}”</div>`).join('')}</div>`).join('') + '</div>';
}

function renderSide(p) {
  const s = p._stats;
  const pr = (a, b) => { const v = s.pairs[a + '-' + b]; return `<span>${esc(name(a))} · ${esc(name(b))}</span><span class="meter"><i style="width:${v == null ? 0 : Math.round(v * 100)}%"></i></span><span>${pct(v)}</span>`; };
  const memos = D().coders.filter(c => S.on.has(c.id)).map(c => {
    const st = D().status.get(c.id + '|' + p.sample_id);
    return `<div class="memo"><header><span class="dot" style="background:${CC[c.id]}"></span>${esc(c.name)}<span class="cnt">${s.counts[c.id]} هایلایت${st?.is_coded ? ' · کدگذاری‌شده' : ''}</span></header>${st?.coder_notes ? `<pre>${esc(st.coder_notes)}</pre>` : '<pre style="color:var(--faint)">بدون یادداشت</pre>'}</div>`;
  }).join('');
  return `<h2>بخش انتخاب‌شده</h2><div id="selBox">${selBox(p)}</div>
    <h2>هم‌پوشانی متن هایلایت‌شده <small>Jaccard، فقط وقتی هر دو کد گذاشته‌اند</small></h2><div class="stat">${pr(1,2)}${pr(1,3)}${pr(2,3)}</div>
    <h2>یادداشت هر نفر برای این پست</h2>${memos}
    <p class="empty" style="margin-top:18px"><kbd>↑</kbd> <kbd>↓</kbd> پست قبلی و بعدی · <kbd>L</kbd> نام کدها در متن</p>`;
}

function renderChips() {
  const el = document.getElementById('coderChips');
  el.innerHTML = D().coders.map(c => `<span class="chip" role="button" tabindex="0" data-c="${c.id}" aria-pressed="${S.on.has(c.id)}"><span class="dot" style="background:${CC[c.id]}"></span>${esc(c.name)}</span>`).join('');
  el.querySelectorAll('.chip').forEach(ch => ch.onclick = ch.onkeydown = e => {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); const id = Number(ch.dataset.c); S.on.has(id) ? S.on.delete(id) : S.on.add(id); S.sel = null; render();
  });
}

function render(keepScroll) {
  if (!D()) return;
  renderChips();
  const p = D().posts.find(x => x.sample_id === S.sid);
  const top = keepScroll ? document.getElementById('reader')?.scrollTop : 0;
  const list = D().posts.map(x => {
    const s = x._stats, vals = Object.values(s.pairs).filter(v => v != null);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    return `<button type="button" data-sid="${esc(x.sample_id)}" aria-current="${x.sample_id === S.sid}"><span class="sid">${esc(x.sample_id)}</span>
      <span class="bars">${[1,2,3].map(c => `<span class="n" title="${esc(name(c))}: ${s.counts[c]} هایلایت" style="background:${s.counts[c] ? CC[c] + '1f' : 'transparent'};color:${s.counts[c] ? CC[c] : '#c5c5c5'}">${s.counts[c] || '·'}</span>`).join('')}</span>
      <span class="ov" title="میانگین هم‌پوشانی بین کسانی که هر دو کد گذاشته‌اند">${avg == null ? '' : pct(avg)}</span></button>`;
  }).join('');
  const legend = D().coders.map(c => `<span><span class="sw" style="background:${CC[c.id]}"></span>${esc(c.name)}</span>`).join('') + '<span><span class="sw" style="background:#f4c54266"></span>دو نفر یا بیشتر</span>';
  app.innerHTML = `<div class="layout${S.labels ? '' : ' hide-lbl'}">
    <aside class="posts" aria-label="پست‌ها"><div class="head"><span style="flex:1">پست</span>${[1,2,3].map(c => `<span class="dot" style="background:${CC[c]}" title="${esc(name(c))}"></span>`).join('')}<span class="ov">هم‌پوشانی</span></div>${list}</aside>
    <main class="reader" id="reader"><div class="wrap">${p ? `
      <div class="meta"><b>${esc(p.sample_id)}</b><span>${esc(p.author_type || '')}</span><span>${esc((p.posted_at || '').slice(0, 10))}</span>${p.post_url ? `<a href="${esc(p.post_url)}" target="_blank" rel="noopener">پست اصلی ↗</a>` : ''}</div>
      <div class="card text" id="ptext">${renderText(p)}</div>
      <div class="legend">${legend}</div>
      <h2>مقایسهٔ بخش‌به‌بخش <small>هر ردیف عبارتی است که دست‌کم یک نفر کد گذاشته</small></h2>${renderTable(p)}` : '<p class="empty">پستی نیست.</p>'}</div></main>
    <aside class="side">${p ? renderSide(p) : ''}</aside></div>`;
  wire(p);
  if (keepScroll) document.getElementById('reader').scrollTop = top;
  app.querySelector('.posts button[aria-current=true]')?.scrollIntoView({ block:'nearest' });
}

function select(p, gi, scroll) {
  S.sel = gi;
  document.querySelectorAll('.s.sel').forEach(x => x.classList.remove('sel'));
  const segs = document.querySelectorAll(`.s[data-g="${gi}"]`);
  segs.forEach(x => x.classList.add('sel'));
  document.getElementById('selBox').innerHTML = selBox(p);
  if (scroll && segs[0]) { segs[0].scrollIntoView({ block:'center', behavior:'smooth' }); segs.forEach(x => { x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash'); }); }
}

function wire(p) {
  app.querySelectorAll('.posts button').forEach(b => b.onclick = () => goto(b.dataset.sid));
  if (!p) return;
  app.querySelectorAll('.s,.lbl').forEach(el => el.onclick = () => select(p, Number(el.dataset.g)));
  app.querySelectorAll('.lbl').forEach(el => {
    const ids = () => [...document.querySelectorAll('.s')].filter(s => s.dataset.hls.split(',').includes(el.dataset.hl));
    el.onmouseenter = () => ids().forEach(s => s.classList.add('hot'));
    el.onmouseleave = () => ids().forEach(s => s.classList.remove('hot'));
  });
  app.querySelectorAll('.cmp tr[data-g]').forEach(tr => tr.onclick = () => select(p, Number(tr.dataset.g), true));
}

function goto(sid) { S.sid = sid; S.sel = null; history.replaceState(null, '', '#' + encodeURIComponent(sid)); render(); }

document.querySelectorAll('.seg button[data-mode]').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode; document.querySelectorAll('.seg button[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(true);
});
const lblBtn = document.getElementById('lblBtn');
const toggleLabels = () => { S.labels = !S.labels; lblBtn.setAttribute('aria-pressed', S.labels); document.querySelector('.layout')?.classList.toggle('hide-lbl', !S.labels); };
lblBtn.onclick = toggleLabels;

window.addEventListener('keydown', e => {
  if (!D() || e.target.closest('input') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'l' || e.key === 'L' || e.key === 'م') { toggleLabels(); return; }
  const i = D().posts.findIndex(p => p.sample_id === S.sid);
  const n = e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowUp' ? i - 1 : null;
  if (n == null || n < 0 || n >= D().posts.length) return;
  e.preventDefault(); goto(D().posts[n].sample_id);
});

load();
})();
</script>
</body>
</html>
